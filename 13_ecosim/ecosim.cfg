[suites]
testing = ecosim_freeze_thaw ecosim_freeze_thaw_restart ecosim_prescribed_phenology

testing_no_geochemistry = ecosim_freeze_thaw ecosim_freeze_thaw_restart ecosim_prescribed_phenology

# ecosim_prescribed_phenology: 365 days with "prescribe phenology" = true, the
# only test that exercises EcoSIM's plant model and the subsurface water source.
# Its gold is a reference for current behavior, not verified physics (see the
# open plant-water questions in the PR review). Its run has two cut steps, so
# check_water_balance.py fails its R2 slightly (about 1e-3; clock defect) while
# R1 passes.
#
# Not registered (checker-only until the EcoSIM coupling clock is fixed; their
# current behavior is a known defect and must not become gold):
#   ecosim_freeze_thaw_dt_{3600s,3599s}      -> check_freeze_thaw_dt.py
#   ecosim_hourly_snow_pulse_{aligned,late}  -> check_hourly_snow_pulse.py
# Also checker-only: ecosim_column_area_{,long_}{1m2,4m2} -> check_column_area.py,
# and check_ecosim_coupling.py <run_dir> on any run with surface visualization.
#
# Water balance: every 13_ecosim input writes water_balance_{surface,subsurface}.dat
# each cycle. The harness does not compare .dat files, so run
#   check_water_balance.py <run_dir> [...]
# separately, including on the registered tests above. The characterization
# cases fail its coupling check (R2) because of the clock defect. The
# old-code failure is stored in data/water_balance_reference/old_source_evaluator.

[default-test-criteria]
# default criteria for all tests, can be overwritten by specific tests
default = 1.0e-8 relative
saturation_liquid = 1.e-4 absolute
temperature = 1.e-4 absolute
surface-temperature = 1.e-4 absolute
surface-snow_depth = 1.e-4 absolute

